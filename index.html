    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #000;
        }

        .header {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            color: white;
            padding: 24px 32px;
            border-bottom: 4px solid #FFA300;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .sync-status {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.8;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            border-bottom: 2px solid rgba(255,163,0,0.3);
        }

        .tab-button {
            padding: 8px 16px;
            background: none;
            color: rgba(255,255,255,0.6);
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: white;
            border-bottom-color: #FFA300;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px 32px;
            display: grid;
            grid-template-columns: 1fr 2.5fr;
            gap: 32px;
        }

        .panel {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 24px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #000;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #FFA300;
        }

        .btn-primary {
            background: #FFA300;
            color: black;
            border: none;
            padding: 10px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
        }

        .btn-primary:hover {
            background: #e69400;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 24px;
            border-radius: 4px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .form-field {
            margin-bottom: 16px;
        }

        .form-field label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-buttons button {
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .forecast-table thead {
            background: #f5f5f5;
        }

        .forecast-table th {
            padding: 12px;
            text-align: center;
            border-bottom: 2px solid #FFA300;
            font-weight: bold;
        }

        .forecast-table th:first-child {
            text-align: left;
        }

        .forecast-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .forecast-table td:first-child {

    <script>
        // ============================================================================
        // STATE MANAGEMENT
        // ============================================================================

        const STATE = {
            designers: [],
            projects: [],
            vacations: [],
            currentWeekOffset: 0,
            currentMonthOffset: 0,
            isConnected: false,
            currentView: 'forecast'
        };

        // ============================================================================
        // SUPABASE CLIENT
        // ============================================================================

        const supabase = window.supabase.createClient(
            'https://ltnxinqkmizvauyehgdx.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0bnhpbnFrbWl6dmF1eWVoZ2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MjI3NDQsImV4cCI6MjEwMzE5ODc0NH0.97x7tXef0BJV7rqtBAGkg2MlYEgb8m--MLqlLqBwlNI'
        );

        // ============================================================================
        // DATA LAYER - Load and sync from Supabase
        // ============================================================================

        async function loadData() {
            try {
                // Fetch all data from Supabase
                const [designersRes, projectsRes, allocationsRes] = await Promise.all([
                    supabase.from('designers').select('*'),
                    supabase.from('projects').select('*'),
                    supabase.from('project_allocations').select('*')
                ]);

                // Try to fetch vacations (table may not exist yet)
                let vacationsRes = { data: [], error: null };
                try {
                    vacationsRes = await supabase.from('designer_vacations').select('*');
                } catch (err) {
                    // Vacations table doesn't exist yet, that's OK
                    vacationsRes = { data: [], error: null };
                }

                if (designersRes.error) throw new Error(`Designers load error: ${designersRes.error.message}`);
                if (projectsRes.error) throw new Error(`Projects load error: ${projectsRes.error.message}`);
                if (allocationsRes.error) throw new Error(`Allocations load error: ${allocationsRes.error.message}`);

                // Build allocation map: project_id → { designer_name: percentage }
                const allocMap = {};
                (allocationsRes.data || []).forEach(a => {
                    if (!allocMap[a.project_id]) allocMap[a.project_id] = {};
                    allocMap[a.project_id][a.designer_name] = a.percentage;
                });

                // Populate STATE
                STATE.designers = (designersRes.data || []).map(d => ({
                    id: d.id,
                    name: d.name,
                    capacity: d.capacity,
                    availability: d.availability
                }));

                STATE.projects = (projectsRes.data || []).map(p => ({
                    id: p.id,
                    name: p.name,
                    totalHours: p.total_hours,
                    startWeekOffset: p.start_week_offset,
                    priority: p.priority || 'Normal',
                    deadlineWeekOffset: p.deadline_week_offset,
                    allocations: allocMap[p.id] || {}
                }));

                STATE.vacations = (vacationsRes.data || []).map(v => ({
                    id: v.id,
                    designerName: v.designer_name,
                    startWeek: v.week_offset_start,
                    endWeek: v.week_offset_end
                }));

                STATE.isConnected = true;
                updateSyncStatus('Connected • Real-time enabled', true);
                render();
            } catch (err) {
                console.error('Data load error:', err);
                updateSyncStatus(`Error: ${err.message}`);
            }
        }

        function setupRealtime() {
            supabase.channel('public:designers')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'designers' }, loadData)
                .subscribe();

            supabase.channel('public:projects')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, loadData)
                .subscribe();

            supabase.channel('public:project_allocations')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'project_allocations' }, loadData)
                .subscribe();

            supabase.channel('public:designer_vacations')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'designer_vacations' }, loadData)
                .subscribe();
        }

        // ============================================================================
        // BUSINESS LOGIC - Core queue simulation
        // ============================================================================

        /**
         * simulateQueue() - The SINGLE source of truth for all consumption calculations
         * Simulates work flow for each designer across weeks, respecting priority/deadlines
         * Returns: {designerName: [hours_w0, hours_w1, ...], ...}
         */
        function simulateQueue(weekOffsets) {
            const result = {};
            const displayWeeks = weekOffsets;
            const allStartWeeks = STATE.projects.filter(p => Object.keys(p.allocations).length > 0).map(p => p.startWeekOffset);
            const minWeek = allStartWeeks.length > 0 ? Math.min(...allStartWeeks, 0) : 0;
            const maxWeek = Math.max(...displayWeeks);

            STATE.designers.forEach(designer => {
                result[designer.name] = Array(displayWeeks.length).fill(0);
                const baseCap = designer.capacity * designer.availability / 100;

                // Get projects allocated to this designer, sorted by priority
                const queue = STATE.projects
                    .filter(p => p.allocations[designer.name])
                    .map(p => ({
                        id: p.id,
                        name: p.name,
                        allocatedHours: p.totalHours * p.allocations[designer.name] / 100,
                        startWeek: p.startWeekOffset,
                        priority: getPriority(p.priority),
                        deadlineWeek: p.deadlineWeekOffset
                    }))
                    .sort((a, b) => {
                        if (a.priority !== b.priority) return a.priority - b.priority;
                        if (a.deadlineWeek && b.deadlineWeek) return a.deadlineWeek - b.deadlineWeek;
                        if (a.deadlineWeek) return -1;
                        if (b.deadlineWeek) return 1;
                        return a.startWeek - b.startWeek;
                    });

                // Simulate work week by week
                const remaining = queue.map(p => p.allocatedHours);
                let queueIdx = 0;

                for (let week = minWeek; week <= maxWeek; week++) {
                    const displayIdx = displayWeeks.indexOf(week);
                    // If on vacation, capacity = 0 (work gets pushed to other designers/later weeks)
                    const effectiveCap = isDesignerOnVacation(designer.name, week) ? 0 : baseCap;
                    let weekUsed = 0;

                    while (queueIdx < queue.length && weekUsed < effectiveCap) {
                        const proj = queue[queueIdx];
                        if (week >= proj.startWeek && remaining[queueIdx] > 0) {
                            const canUse = Math.min(remaining[queueIdx], effectiveCap - weekUsed);
                            if (displayIdx !== -1) {
                                result[designer.name][displayIdx] += canUse;
                            }
                            remaining[queueIdx] -= canUse;
                            weekUsed += canUse;
                            if (remaining[queueIdx] <= 0.01) queueIdx++;
                        } else if (week < proj.startWeek) {
                            break;
                        } else {
                            queueIdx++;
                        }
                    }
                }
            });

            return result;
        }

        function getPriority(name) {
            return { Critical: 0, High: 1, Normal: 2 }[name] ?? 2;
        }

        function getEffectiveCapacity(designer) {
            return designer.capacity * designer.availability / 100;
        }

        function isDesignerOnVacation(designerName, weekOffset) {
            return STATE.vacations.some(v => 
                v.designerName === designerName && 
                weekOffset >= v.startWeek && 
                weekOffset <= v.endWeek
            );
        }

        // ============================================================================
        // DATE/TIME HELPERS
        // ============================================================================

        function getWeekStartDate(offset) {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            monday.setDate(monday.getDate() + offset * 7);
            return monday;
        }

        function getDateRange(offset) {
            const start = getWeekStartDate(offset);
            const end = new Date(start);
            end.setDate(end.getDate() + 4);
            return {
                start,
                end,
                label: `${start.getMonth() + 1}/${start.getDate()}-${end.getMonth() + 1}/${end.getDate()}`
            };
        }

        function getMonthRange(offset) {
            const today = new Date();
            const baseMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            const targetMonth = new Date(baseMonth.getFullYear(), baseMonth.getMonth() + offset, 1);
            const nextMonth = new Date(targetMonth.getFullYear(), targetMonth.getMonth() + 1, 1);
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return {
                start: targetMonth,
                end: nextMonth,
                label: `${monthNames[targetMonth.getMonth()]} ${targetMonth.getFullYear()}`
            };
        }

        // ============================================================================
        // RENDERING
        // ============================================================================

        function updateSyncStatus(msg, ok = false) {
            document.getElementById('syncStatus').textContent = msg;
            document.getElementById('syncStatus').style.color = ok ? '#27ae60' : '#999';
        }

        function render() {
            if (STATE.currentView === 'forecast') renderForecastView();
            else if (STATE.currentView === 'breakdown') renderBreakdownView();
            else if (STATE.currentView === 'atrisk') renderAtRiskView();
        }

        function renderForecastView() {
            renderTeamList();
            renderProjectsList();
            renderForecastTable();
            renderStats();
            renderProjectQueue();
        }

        function renderTeamList() {
            const container = document.getElementById('teamList');
            if (STATE.designers.length === 0) {
                container.innerHTML = '<p style="color: #999;">No designers added</p>';
                return;
            }
            container.innerHTML = STATE.designers.map(d => {
                const available = (d.capacity * d.availability / 100).toFixed(1);
                return `
                    <div style="background: #f5f5f5; padding: 12px; margin-top: 12px; border-radius: 3px; cursor: pointer;"
                         onclick="editDesignerModal('${d.name}')">
                        <div style="font-weight: bold;">${d.name}</div>
                        <div style="font-size: 11px; color: #666;">${available}h available / ${d.capacity}h week (${d.availability}%)</div>
                    </div>
                `;
            }).join('');
        }

        function renderProjectsList() {
            const container = document.getElementById('projectsList');
            if (STATE.projects.length === 0) {
                container.innerHTML = '<p style="color: #999;">No projects created</p>';
                return;
            }
            const sorted = [...STATE.projects].sort((a, b) => a.name.localeCompare(b.name));
            container.innerHTML = sorted.map(p => {
                const alloc = Object.keys(p.allocations).join(', ');
                const range = getDateRange(p.startWeekOffset).label;
                return `
                    <div style="background: #f5f5f5; padding: 12px; margin-top: 8px; border-radius: 3px; cursor: pointer;"
                         onclick="editProjectModal('${p.name}')">
                        <div style="font-weight: bold;">${p.name}</div>
                        <div style="font-size: 11px; color: #666;">${p.totalHours}h • Week ${range} • ${alloc}</div>
                    </div>
                `;
            }).join('');
        }

        function renderForecastTable() {
            const weeks = [0, 1, 2, 3];
            const weekOffsets = weeks.map(w => STATE.currentWeekOffset + w);
            const consumption = simulateQueue(weekOffsets);
            const totalCap = STATE.designers.reduce((sum, d) => sum + getEffectiveCapacity(d), 0);

            document.getElementById('weekLabel').textContent = getDateRange(STATE.currentWeekOffset).label;

            let html = '<table class="forecast-table"><thead><tr><th>Designer</th>';
            weekOffsets.forEach(w => {
                html += `<th>${getDateRange(w).label}</th>`;
            });
            html += '</tr></thead><tbody>';

            STATE.designers.forEach(d => {
                const cap = getEffectiveCapacity(d);
                const hours = consumption[d.name];
                html += '<tr><td>' + d.name + '</td>';
                weekOffsets.forEach((w, idx) => {
                    const onVacation = isDesignerOnVacation(d.name, w);
                    if (onVacation) {
                        html += `<td style="text-align: center; background: #d0d0d0; color: #666;">
                            <div style="font-weight: bold;">VACATION</div>
                        </td>`;
                    } else {
                        const h = hours[idx];
                        const util = (h / cap) * 100;
                        const bgClass = util >= 100 ? 'util-red' : util >= 75 ? 'util-yellow' : 'util-green';
                        html += `<td class="${bgClass}" style="text-align: center;">
                            <div style="font-weight: bold; font-size: 18px;">${util.toFixed(0)}%</div>
                            <div style="font-size: 11px; color: #666;">${h.toFixed(1)}h</div>
                        </td>`;
                    }
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById('forecastTableContainer').innerHTML = html;
        }

        function renderStats() {
            const weeks = [0, 1, 2, 3];
            const weekOffsets = weeks.map(w => STATE.currentWeekOffset + w);
            const consumption = simulateQueue(weekOffsets);
            const totalCap = STATE.designers.reduce((sum, d) => sum + getEffectiveCapacity(d), 0);

            let weeklyTotals = [0, 0, 0, 0];
            STATE.designers.forEach(d => {
                consumption[d.name].forEach((h, i) => {
                    weeklyTotals[i] += h;
                });
            });

            const avgWeekly = weeklyTotals.reduce((a, b) => a + b) / 4;
            const maxWeekly = Math.max(...weeklyTotals);
            const utilPercent = (avgWeekly / totalCap) * 100;

            document.getElementById('statsContainer').innerHTML = `
                <div style="background: #f5f5f5; padding: 12px; margin-bottom: 12px; border-radius: 3px; border-left: 4px solid #FFA300;">
                    <div style="font-size: 11px; font-weight: bold; text-transform: uppercase; color: #666;">Team Capacity</div>
                    <div style="font-size: 18px; font-weight: bold;">${STATE.designers.length} designers, ${totalCap.toFixed(1)}h/week</div>
                </div>
                <div style="background: #f5f5f5; padding: 12px; margin-bottom: 12px; border-radius: 3px; border-left: 4px solid #FFA300;">
                    <div style="font-size: 11px; font-weight: bold; text-transform: uppercase; color: #666;">Average Load</div>
                    <div style="font-size: 18px; font-weight: bold;">${avgWeekly.toFixed(1)}h (${utilPercent.toFixed(0)}%)</div>
                </div>
                <div style="background: #f5f5f5; padding: 12px; margin-bottom: 12px; border-radius: 3px; border-left: 4px solid #FFA300;">
                    <div style="font-size: 11px; font-weight: bold; text-transform: uppercase; color: #666;">Peak Load</div>
                    <div style="font-size: 18px; font-weight: bold;">${maxWeekly.toFixed(1)}h (${((maxWeekly / totalCap) * 100).toFixed(0)}%)</div>
                </div>
            `;
        }

        function renderProjectQueue() {
            const sorted = [...STATE.projects].sort((a, b) => {
                const ap = getPriority(a.priority);
                const bp = getPriority(b.priority);
                if (ap !== bp) return ap - bp;
                if (a.deadlineWeekOffset && b.deadlineWeekOffset) return a.deadlineWeekOffset - b.deadlineWeekOffset;
                if (a.deadlineWeekOffset) return -1;
                if (b.deadlineWeekOffset) return 1;
                return a.startWeekOffset - b.startWeekOffset;
            });

            let html = '';
            if (sorted.length === 0) {
                html = '<p style="color: #999;">No projects</p>';
            } else {
                html = sorted.map(p => {
                    const alloc = Object.entries(p.allocations).map(([n, pct]) => `${n} ${pct}%`).join(', ');
                    return `
                        <div style="background: #f5f5f5; padding: 12px; margin-bottom: 8px; border-radius: 3px; border-left: 3px solid #FFA300;">
                            <div style="font-weight: bold;">${p.name}</div>
                            <div style="font-size: 11px; color: #666;">${p.totalHours}h • ${alloc}</div>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('projectQueueContainer').innerHTML = html;
        }

        function renderBreakdownView() {
            renderWeeklyBreakdown();
            renderMonthlyBreakdown();
        }

        function renderWeeklyBreakdown() {
            const weeks = [0, 1, 2, 3];
            const weekOffsets = weeks.map(w => STATE.currentWeekOffset + w);
            const consumption = simulateQueue(weekOffsets);

            document.getElementById('weekBreakdownLabel').textContent = getDateRange(STATE.currentWeekOffset).label;

            let html = '<table class="forecast-table"><thead><tr><th>Designer</th>';
            weekOffsets.forEach(w => {
                html += `<th>${getDateRange(w).label}</th>`;
            });
            html += '</tr></thead><tbody>';

            STATE.designers.forEach(d => {
                const cap = getEffectiveCapacity(d);
                html += '<tr><td>' + d.name + '</td>';
                weekOffsets.forEach((w, idx) => {
                    const onVacation = isDesignerOnVacation(d.name, w);
                    if (onVacation) {
                        html += `<td style="text-align: center; background: #d0d0d0; color: #666;">
                            <div style="font-weight: bold;">VACATION</div>
                        </td>`;
                    } else {
                        const h = consumption[d.name][idx];
                        const util = (h / cap) * 100;
                        const bgClass = util >= 100 ? 'util-red' : util >= 75 ? 'util-yellow' : 'util-green';
                        html += `<td class="${bgClass}" style="text-align: center;">
                            <div style="font-weight: bold; font-size: 18px;">${util.toFixed(0)}%</div>
                            <div style="font-size: 11px;">${h.toFixed(1)}h</div>
                        </td>`;
                    }
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById('weeklyBreakdownContainer').innerHTML = html;
        }

        function renderMonthlyBreakdown() {
            const months = [0, 1, 2, 3];
            const monthOffsets = months.map(m => STATE.currentMonthOffset + m);
            
            // Convert months to weeks for simulation
            const allWeeksInMonths = [];
            monthOffsets.forEach(m => {
                const range = getMonthRange(m);
                for (let w = -10; w <= 20; w++) {
                    const weekRange = getDateRange(w);
                    if (weekRange.start >= range.start && weekRange.start < range.end) {
                        allWeeksInMonths.push(w);
                    }
                }
            });

            const consumption = simulateQueue(allWeeksInMonths);
            
            // Aggregate by month
            const monthlyData = {};
            STATE.designers.forEach(d => {
                monthlyData[d.name] = [{}, {}, {}, {}];
                
                allWeeksInMonths.forEach((w, idx) => {
                    const weekRange = getDateRange(w);
                    monthOffsets.forEach((m, monthIdx) => {
                        const monthRange = getMonthRange(m);
                        if (weekRange.start >= monthRange.start && weekRange.start < monthRange.end) {
                            // Find which projects were worked on this week
                            // (simplified: just use total hours)
                            const weekIndex = allWeeksInMonths.indexOf(w);
                            if (!monthlyData[d.name][monthIdx].total) {
                                monthlyData[d.name][monthIdx].total = 0;
                            }
                            monthlyData[d.name][monthIdx].total += consumption[d.name][weekIndex] || 0;
                        }
                    });
                });
            });

            document.getElementById('monthLabel').textContent = getMonthRange(STATE.currentMonthOffset).label;

            let html = '<table class="forecast-table"><thead><tr><th>Designer</th>';
            monthOffsets.forEach(m => {
                html += `<th>${getMonthRange(m).label}</th>`;
            });
            html += '</tr></thead><tbody>';

            STATE.designers.forEach(d => {
                const cap = getEffectiveCapacity(d);
                html += '<tr><td>' + d.name + '</td>';
                
                monthOffsets.forEach(m => {
                    const range = getMonthRange(m);
                    const daysInMonth = (range.end - range.start) / (24 * 60 * 60 * 1000);
                    const weeksInMonth = daysInMonth / 7;
                    const monthCap = cap * weeksInMonth;
                    
                    const monthIdx = monthOffsets.indexOf(m);
                    const hoursInMonth = monthlyData[d.name][monthIdx].total || 0;
                    const util = monthCap > 0 ? (hoursInMonth / monthCap) * 100 : 0;
                    
                    const bgClass = util >= 100 ? 'util-red' : util >= 75 ? 'util-yellow' : 'util-green';
                    html += `<td class="${bgClass}" style="text-align: center;">
                        <div style="font-weight: bold; font-size: 18px;">${util.toFixed(0)}%</div>
                        <div style="font-size: 11px;">${hoursInMonth.toFixed(1)}h</div>
                    </td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById('monthlyBreakdownContainer').innerHTML = html;
        }

        function renderAtRiskView() {
            let html = '';
            // TODO: Implement at-risk detection
            html = '<p style="color: #999; font-size: 14px;">At-risk detection coming soon...</p>';
            document.getElementById('atriskContainer').innerHTML = html;
        }

        // ============================================================================
        // MODALS
        // ============================================================================

        function showModal(content) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal">${content}</div>`;
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });
            document.body.appendChild(overlay);
            return overlay;
        }

        function editDesignerModal(name) {
            const d = STATE.designers.find(x => x.name === name);
            if (!d) return;

            const vacations = STATE.vacations.filter(v => v.designerName === name);
            let vacationHtml = '';
            if (vacations.length > 0) {
                vacationHtml = '<div style="margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 3px;">';
                vacationHtml += '<div style="font-weight: bold; margin-bottom: 8px;">Scheduled Vacations:</div>';
                vacations.forEach(v => {
                    vacationHtml += `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span>Weeks ${v.startWeek} to ${v.endWeek}</span>
                            <button onclick="removeVacation(${v.id})" style="background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 2px; cursor: pointer; font-size: 12px;">Remove</button>
                        </div>
                    `;
                });
                vacationHtml += '</div>';
            }

            const html = `
                <h2>Edit Designer: ${d.name}</h2>
                <div class="form-field">
                    <label>Weekly Hours</label>
                    <input type="number" id="editCapacity" value="${d.capacity}">
                </div>
                <div class="form-field">
                    <label>Available for Design (%)</label>
                    <input type="number" id="editAvailability" value="${d.availability}" min="0" max="100">
                </div>
                ${vacationHtml}
                <button onclick="setVacationModal('${d.name}')" style="width: 100%; background: #fff; border: 1px solid #FFA300; color: #FFA300; padding: 10px; border-radius: 3px; cursor: pointer; margin-top: 12px; font-weight: bold;">Set Vacation Period</button>
                <div class="modal-buttons" style="margin-top: 16px;">
                    <button onclick="document.querySelector('.modal-overlay').remove()">Cancel</button>
                    <button onclick="saveEditDesigner('${d.name}')" style="background: #FFA300; border: none; color: black;">Save</button>
                </div>
                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #ddd;">
                    <button onclick="removeDesigner('${d.name}')" style="width: 100%; background: #e74c3c; color: white; border: none; padding: 8px; border-radius: 3px; cursor: pointer;">Delete</button>
                </div>
            `;
            showModal(html);
        }

        function editProjectModal(name) {
            const p = STATE.projects.find(x => x.name === name);
            if (!p) return;

            let allocHtml = '';
            STATE.designers.forEach((d, i) => {
                const isLast = i === STATE.designers.length - 1;
                const current = p.allocations[d.name] || 0;
                allocHtml += `
                    <div class="form-field">
                        <label>${d.name}${isLast ? ' (absorbs remainder)' : ''}</label>
                        <input type="number" class="alloc-input" data-designer="${d.name}" value="${current}" min="0" max="100" ${isLast ? 'readonly' : ''}>
                    </div>
                `;
            });

            const html = `
                <h2>Edit Project: ${p.name}</h2>
                <div class="form-field">
                    <label>Total Design Hours</label>
                    <input type="number" id="editHours" value="${p.totalHours}">
                </div>
                <div class="form-field">
                    <label>Priority</label>
                    <select id="editPriority">
                        <option value="Normal" ${p.priority === 'Normal' ? 'selected' : ''}>Normal</option>
                        <option value="High" ${p.priority === 'High' ? 'selected' : ''}>High</option>
                        <option value="Critical" ${p.priority === 'Critical' ? 'selected' : ''}>Critical</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Start Week</label>
                    <input type="number" id="editStartWeek" value="${p.startWeekOffset}">
                </div>
                <div class="form-field">
                    <label>Deadline Week (blank = none)</label>
                    <input type="number" id="editDeadlineWeek" value="${p.deadlineWeekOffset || ''}">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px;">Allocations (%)</label>
                    ${allocHtml}
                </div>
                <div class="modal-buttons">
                    <button onclick="document.querySelector('.modal-overlay').remove()">Cancel</button>
                    <button onclick="saveEditProject('${p.name}')" style="background: #FFA300; border: none; color: black;">Save</button>
                </div>
                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #ddd;">
                    <button onclick="removeProject('${p.name}')" style="width: 100%; background: #e74c3c; color: white; border: none; padding: 8px; border-radius: 3px; cursor: pointer;">Delete</button>
                </div>
            `;
            showModal(html);
        }

        function setVacationModal(designerName) {
            const html = `
                <h2>Set Vacation for ${designerName}</h2>
                <div class="form-field">
                    <label>Start Week Offset</label>
                    <input type="number" id="vacStartWeek" value="0" placeholder="e.g., 5">
                </div>
                <div class="form-field">
                    <label>End Week Offset</label>
                    <input type="number" id="vacEndWeek" value="0" placeholder="e.g., 8">
                </div>
                <div style="font-size: 12px; color: #666; margin-bottom: 16px;">
                    Example: Week 0 is this week, Week 5 is 5 weeks from now
                </div>
                <div class="modal-buttons">
                    <button onclick="document.querySelector('.modal-overlay').remove()">Cancel</button>
                    <button onclick="saveVacation('${designerName}')" style="background: #FFA300; border: none; color: black;">Add Vacation</button>
                </div>
            `;
            showModal(html);
        }

        async function saveVacation(designerName) {
            const startWeek = parseInt(document.getElementById('vacStartWeek').value);
            const endWeek = parseInt(document.getElementById('vacEndWeek').value);

            if (isNaN(startWeek) || isNaN(endWeek)) {
                alert('Enter valid week numbers');
                return;
            }

            if (endWeek < startWeek) {
                alert('End week must be >= start week');
                return;
            }

            const { error } = await supabase.from('designer_vacations').insert([{
                designer_name: designerName,
                week_offset_start: startWeek,
                week_offset_end: endWeek
            }]);

            if (error) {
                if (error.message.includes('does not exist')) {
                    alert('Vacation table does not exist. Please run this SQL in Supabase:\n\nCREATE TABLE designer_vacations (\n  id bigint PRIMARY KEY GENERATED ALWAYS AS IDENTITY,\n  designer_name text NOT NULL REFERENCES designers(name) ON DELETE CASCADE,\n  week_offset_start integer NOT NULL,\n  week_offset_end integer NOT NULL,\n  created_at timestamp DEFAULT now()\n);');
                } else {
                    alert('Error: ' + error.message);
                }
                return;
            }

            document.querySelector('.modal-overlay')?.remove();
            await loadData();
        }

        async function removeVacation(vacationId) {
            if (!confirm('Remove this vacation period?')) return;

            const { error } = await supabase.from('designer_vacations').delete().eq('id', vacationId);
            if (error) alert('Error: ' + error.message);
            else await loadData();
        }

        // ============================================================================
        // EVENT HANDLERS
        // ============================================================================

        async function saveEditDesigner(name) {
            const cap = parseInt(document.getElementById('editCapacity').value) || 40;
            const avail = Math.max(0, Math.min(100, parseInt(document.getElementById('editAvailability').value) || 70));

            const { error } = await supabase.from('designers').update({ capacity: cap, availability: avail }).eq('name', name);
            if (error) alert('Error: ' + error.message);
            else {
                document.querySelector('.modal-overlay')?.remove();
                await loadData();
            }
        }

        async function removeDesigner(name) {
            if (!confirm(`Remove ${name}?`)) return;
            const { error } = await supabase.from('designers').delete().eq('name', name);
            if (error) alert('Error: ' + error.message);
            else {
                document.querySelector('.modal-overlay')?.remove();
                await loadData();
            }
        }

        async function saveEditProject(name) {
            const hours = parseFloat(document.getElementById('editHours').value) || 0;
            const priority = document.getElementById('editPriority').value;
            const startWeek = parseInt(document.getElementById('editStartWeek').value);
            const deadlineWeek = document.getElementById('editDeadlineWeek').value ? parseInt(document.getElementById('editDeadlineWeek').value) : null;

            const p = STATE.projects.find(x => x.name === name);
            if (!p) return;

            // Update project
            const { error: projError } = await supabase.from('projects').update({
                total_hours: hours,
                start_week_offset: startWeek,
                priority,
                deadline_week_offset: deadlineWeek
            }).eq('id', p.id);

            if (projError) { alert('Error updating project: ' + projError.message); return; }

            // Delete old allocations
            await supabase.from('project_allocations').delete().eq('project_id', p.id);

            // Insert new allocations
            const allocInputs = document.querySelectorAll('.alloc-input');
            const newAllocs = [];
            allocInputs.forEach(input => {
                const pct = parseInt(input.value) || 0;
                if (pct > 0) {
                    newAllocs.push({
                        project_id: p.id,
                        designer_name: input.dataset.designer,
                        percentage: pct
                    });
                }
            });

            if (newAllocs.length > 0) {
                const { error: allocError } = await supabase.from('project_allocations').insert(newAllocs);
                if (allocError) { alert('Error updating allocations: ' + allocError.message); return; }
            }

            document.querySelector('.modal-overlay')?.remove();
            await loadData();
        }

        async function removeProject(name) {
            if (!confirm(`Remove ${name}?`)) return;
            const p = STATE.projects.find(x => x.name === name);
            if (!p) return;

            const { error } = await supabase.from('projects').delete().eq('id', p.id);
            if (error) alert('Error: ' + error.message);
            else {
                document.querySelector('.modal-overlay')?.remove();
                await loadData();
            }
        }

        // ============================================================================
        // INIT & EVENT SETUP
        // ============================================================================

        async function init() {
            // Load initial data
            await loadData();

            // Setup real-time sync
            setupRealtime();

            // Show app
            document.getElementById('appContainer').style.display = 'block';

            // Setup event listeners
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    STATE.currentView = btn.dataset.tab;
                    document.querySelectorAll('[id$="View"]').forEach(v => v.style.display = 'none');
                    document.getElementById(STATE.currentView + 'View').style.display = '';
                    render();
                });
            });

            document.getElementById('createProjectBtn').addEventListener('click', () => {
                const html = `
                    <h2>Create Project</h2>
                    <div class="form-field">
                        <label>Project Name</label>
                        <input type="text" id="newProjName" placeholder="e.g., Goldman DDP">
                    </div>
                    <div class="form-field">
                        <label>Total Design Hours</label>
                        <input type="number" id="newProjHours" value="40">
                    </div>
                    <div class="form-field">
                        <label>Priority</label>
                        <select id="newProjPriority">
                            <option>Normal</option>
                            <option>High</option>
                            <option>Critical</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Start Week</label>
                        <input type="number" id="newProjStartWeek" value="0">
                    </div>
                    <div class="form-field">
                        <label>Deadline Week (blank = none)</label>
                        <input type="number" id="newProjDeadlineWeek">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 8px;">Allocations (%)</label>
                        ${STATE.designers.map((d, i) => {
                            const isLast = i === STATE.designers.length - 1;
                            return `
                                <div class="form-field">
                                    <label>${d.name}${isLast ? ' (absorbs remainder)' : ''}</label>
                                    <input type="number" class="new-alloc" data-designer="${d.name}" value="0" min="0" max="100" ${isLast ? 'readonly' : ''}>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="modal-buttons">
                        <button onclick="document.querySelector('.modal-overlay').remove()">Cancel</button>
                        <button onclick="saveNewProject()" style="background: #FFA300; border: none; color: black;">Create</button>
                    </div>
                `;
                showModal(html);
            });

            document.getElementById('addDesignerBtn').addEventListener('click', saveNewDesigner);
            
            document.getElementById('prevWeekBtn').addEventListener('click', () => {
                STATE.currentWeekOffset--;
                renderForecastTable();
                renderStats();
            });
            document.getElementById('nextWeekBtn').addEventListener('click', () => {
                STATE.currentWeekOffset++;
                renderForecastTable();
                renderStats();
            });
            document.getElementById('thisWeekBtn').addEventListener('click', () => {
                STATE.currentWeekOffset = 0;
                renderForecastTable();
                renderStats();
            });

            document.getElementById('prevWeekBreakdownBtn').addEventListener('click', () => {
                STATE.currentWeekOffset--;
                renderWeeklyBreakdown();
            });
            document.getElementById('nextWeekBreakdownBtn').addEventListener('click', () => {
                STATE.currentWeekOffset++;
                renderWeeklyBreakdown();
            });
            document.getElementById('thisWeekBreakdownBtn').addEventListener('click', () => {
                STATE.currentWeekOffset = 0;
                renderWeeklyBreakdown();
            });

            document.getElementById('prevMonthBtn').addEventListener('click', () => {
                STATE.currentMonthOffset--;
                renderMonthlyBreakdown();
            });
            document.getElementById('nextMonthBtn').addEventListener('click', () => {
                STATE.currentMonthOffset++;
                renderMonthlyBreakdown();
            });
            document.getElementById('thisMonthBtn').addEventListener('click', () => {
                STATE.currentMonthOffset = 0;
                renderMonthlyBreakdown();
            });
        }

        async function saveNewDesigner() {
            const name = document.getElementById('designerName').value.trim();
            const cap = parseInt(document.getElementById('designerCapacity').value) || 40;
            const avail = Math.max(0, Math.min(100, parseInt(document.getElementById('designerAvailability').value) || 70));

            if (!name) { alert('Enter designer name'); return; }
            if (STATE.designers.some(d => d.name === name)) { alert('Designer already exists'); return; }

            const { error } = await supabase.from('designers').insert([{ name, capacity: cap, availability: avail }]);
            if (error) { alert('Error: ' + error.message); return; }

            document.getElementById('designerName').value = '';
            document.getElementById('designerCapacity').value = '40';
            document.getElementById('designerAvailability').value = '70';
            await loadData();
        }

        async function saveNewProject() {
            const name = document.getElementById('newProjName').value.trim();
            const hours = parseFloat(document.getElementById('newProjHours').value) || 0;
            const priority = document.getElementById('newProjPriority').value;
            const startWeek = parseInt(document.getElementById('newProjStartWeek').value);
            const deadlineWeek = document.getElementById('newProjDeadlineWeek').value ? parseInt(document.getElementById('newProjDeadlineWeek').value) : null;

            if (!name) { alert('Enter project name'); return; }
            if (hours <= 0) { alert('Hours must be > 0'); return; }
            if (STATE.projects.some(p => p.name === name)) { alert('Project already exists'); return; }

            // Insert project
            const { data: projData, error: projError } = await supabase.from('projects').insert([{
                name,
                total_hours: hours,
                start_week_offset: startWeek,
                priority,
                deadline_week_offset: deadlineWeek
            }]).select();

            if (projError) { alert('Error: ' + projError.message); return; }

            const projId = projData[0].id;

            // Insert allocations
            const allocInputs = document.querySelectorAll('.new-alloc');
            const allocs = [];
            allocInputs.forEach(input => {
                const pct = parseInt(input.value) || 0;
                if (pct > 0) {
                    allocs.push({
                        project_id: projId,
                        designer_name: input.dataset.designer,
                        percentage: pct
                    });
                }
            });

            if (allocs.length > 0) {
                const { error: allocError } = await supabase.from('project_allocations').insert(allocs);
                if (allocError) { alert('Error: ' + allocError.message); return; }
            }

            document.querySelector('.modal-overlay')?.remove();
            await loadData();
        }

        // Start the app
        init();
    </script>
</body>
